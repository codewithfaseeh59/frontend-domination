<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling in CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: "💀";
            text-decoration: none;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            /* list-style: none; */
            gap: 20px;
            background-color: blueviolet;

        }


        nav ul li {
            /* list-style: none; */


            list-style-position: inside;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>

</html>
