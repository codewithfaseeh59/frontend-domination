<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        body {
            background-color: #111;
        }

        .container {
            border: 2px solid red;
            font-size: 4rem;
            font-family: "poppins";
            padding: 50px;
            color: yellow;
            /* box-shadow: x-axis y-axis blur-radius spread color; */
            /* box-shadow: 60px 20px 50px 8px; */
            /* box-shadow: inset 7px -4px 8px 8px; */
            /* box-shadow: inset 20px 20px; */

            /* box-shadow:inset -4px 2px 15px 13px rgb(16 32 221); */


            /* box-shadow: -52px 37px 136px 18px rgba(29, 99, 204, 0.75);
            -webkit-box-shadow: -52px 37px 136px 18px rgba(29, 99, 204, 0.75);
            -moz-box-shadow: -52px 37px 136px 18px rgba(29, 99, 204, 0.75); */

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07),
                0 2px 4px rgba(0, 0, 0, 0.07),
                0 4px 8px rgba(0, 0, 0, 0.07),
                0 8px 16px rgba(0, 0, 0, 0.07);
                visibility: hidden;
        }

        p{
            border: 4px solid blueviolet;
            /* border-radius: 20px; */
            color: white;
            font-size: 2vw;
            font-family: "poppins";
            outline: 2px solid red;
            outline-offset: 6px;
            /* outline-offset: -6px; */
            

        }
    </style>
</head>

<body>
    <div class="container">
        I am a main container
    </div>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Cum quaerat saepe sed sequi at officia laudantium rem cumque dolorum aperiam, inventore perferendis laborum.
    </p>
</body>

</html>
